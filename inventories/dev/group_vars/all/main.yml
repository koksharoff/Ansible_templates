---
# Variables for every host in the DEV environment.
# They override role defaults (roles/*/defaults/main.yml).
# Secrets go to vault.yml next to this file (see README, "Secrets").

server_environment: dev

# --- Connection ---------------------------------------------------------------
# Automation user created by playbooks/bootstrap.yml; all other playbooks use it.
system_bootstrap_user: bootstrap_agent
ansible_user: "{{ system_bootstrap_user }}"

# One place to change the SSH port: sshd, UFW, fail2ban and Ansible follow it.
server_ssh_port: 22
ansible_port: "{{ server_ssh_port }}"
ssh_hardening_port: "{{ server_ssh_port }}"
firewall_ssh_port: "{{ server_ssh_port }}"
fail2ban_sshd_port: "{{ server_ssh_port }}"

# REQUIRED: public keys allowed to log in as the automation user.
admin_ssh_keys: []
#  - "ssh-ed25519 AAAAC3Nza... admin@laptop"
system_bootstrap_ssh_keys: "{{ admin_ssh_keys }}"

# --- Admin accounts -----------------------------------------------------------
users_list: []
#  - name: alice
#    comment: "Alice Smith"
#    groups: [sudo]
#    ssh_keys: "{{ admin_ssh_keys }}"
#    password_hash: "{{ vault_users_alice_password_hash }}"

# --- Common -------------------------------------------------------------------
common_timezone: "UTC"
common_packages_extra:
  - ncdu
  - netcat-openbsd
  - strace
  - tcpdump
common_journald_system_max_use: "200M"

# --- SSH ----------------------------------------------------------------------
# Port forwarding is handy for debugging (DB tunnels etc.) - dev only.
ssh_hardening_allow_tcp_forwarding: true
ssh_hardening_log_level: INFO

# --- Firewall -----------------------------------------------------------------
firewall_ssh_allowed_sources:
  - any

# --- fail2ban -----------------------------------------------------------------
fail2ban_maxretry: 10
fail2ban_bantime: "10m"

# --- Updates ------------------------------------------------------------------
# Dev may reboot by itself after kernel updates.
unattended_upgrades_automatic_reboot: true
unattended_upgrades_automatic_reboot_time: "05:00"
