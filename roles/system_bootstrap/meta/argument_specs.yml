---
argument_specs:
  main:
    short_description: Create the automation user on a fresh server
    options:
      system_bootstrap_user:
        type: str
        default: bootstrap_agent
        description: Name of the automation user.
      system_bootstrap_user_shell:
        type: str
        default: /bin/bash
        description: Login shell of the automation user.
      system_bootstrap_user_groups:
        type: list
        elements: str
        default: [sudo]
        description: Supplementary groups of the automation user.
      system_bootstrap_ssh_keys:
        type: list
        elements: str
        required: true
        description: Public SSH keys authorized for the automation user.
      system_bootstrap_ssh_keys_exclusive:
        type: bool
        default: true
        description: Remove keys that are not listed in system_bootstrap_ssh_keys.
      system_bootstrap_passwordless_sudo:
        type: bool
        default: true
        description: Grant NOPASSWD sudo to the automation user.
      system_bootstrap_user_password_hash:
        type: str
        default: ""
        description: Optional SHA-512 password hash. Empty keeps password login locked.
      system_bootstrap_install_python:
        type: bool
        default: true
        description: Install python3 with raw commands when it is missing.
