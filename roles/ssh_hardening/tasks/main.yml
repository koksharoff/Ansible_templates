---
- name: Guard against locking out the automation user
  ansible.builtin.assert:
    that:
      - ssh_hardening_permit_root_login != 'no' or ssh_hardening_connection_user != 'root'
      - ssh_hardening_allow_users | length == 0 or ssh_hardening_connection_user in ssh_hardening_allow_users
    fail_msg: >-
      Applying this configuration would lock out '{{ ssh_hardening_connection_user }}'.
      Run playbooks/bootstrap.yml first and connect as the automation user,
      or add it to ssh_hardening_allow_users.
    quiet: true
  vars:
    ssh_hardening_connection_user: "{{ ansible_user | default(lookup('ansible.builtin.env', 'USER')) }}"

- name: Install OpenSSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Ensure sshd_config includes the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Deploy hardened sshd configuration
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: "{{ ssh_hardening_config_file }}"
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

# Ubuntu 24.04+ starts sshd through ssh.socket; a port change then needs a socket restart
- name: Check whether sshd is socket-activated
  ansible.builtin.systemd_service:
    name: ssh.socket
  register: ssh_hardening_socket
  failed_when: false

- name: Ensure ssh service is running
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
  when: not ssh_hardening_socket_activated
